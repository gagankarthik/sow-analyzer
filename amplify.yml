version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        # Gate the deploy: a type error or failing test stops the build here.
        - npx tsc --noEmit -p .
        - npm test
    build:
      commands:
        # Amplify gives environment variables to the build only. Server routes
        # read these at runtime, so copy them into .env.production (not committed).
        - env | grep -E '^(OPENAI_API_KEY|OPENAI_MODEL|OPENAI_BASE_URL|AI_PROVIDER|GUARDRAILS_ENABLED|REDACT_CLASSES|CSP_STORAGE_ORIGIN)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
